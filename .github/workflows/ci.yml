name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Інструменти
        timeout-minutes: 40
        run: |
          # Лише варіант win32 (без posix: удвічі менше завантажувати — дзеркало Ubuntu на раннерах буває
          # повільним, 115 МБ ішли 29 хв).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
          rustup default stable
      - name: Тести бібліотеки
        run: cargo test --lib
      - name: Збирання exe для Windows
        run: cargo build --release --target x86_64-pc-windows-gnu
